[package]
name = "chrono-judge-projects-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
vstd = "=0.0.0-2026-04-20-1748"
chrono-judge-projects = { path = "../judge-projects" }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[test]]
name = "languages"
path = "tests/languages.rs"

[[test]]
name = "verified_languages"
path = "tests/verified_languages.rs"

[[test]]
name = "impact_summary"
path = "tests/impact_summary.rs"

[[test]]
name = "evidence_query"
path = "tests/evidence_query.rs"

[[test]]
name = "plan_trace"
path = "tests/plan_trace.rs"

[dev-dependencies]
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
sha2 = "0.10"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tracing-tunnel = { version = "0.1.0", default-features = false, features = ["std"] }

[[test]]
name = "deployed_host"
path = "../../.chrono-harness/ci/host_adapters.rs"
