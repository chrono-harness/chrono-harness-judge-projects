[package]
name = "chrono-judge-projects"
version = "0.1.4"
edition = "2024"
publish = false

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-judge-projects"
path = "src/main.rs"
test = false
bench = false

[dependencies]
hex = "0.4"
digest-io = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tracing-tunnel = { version = "0.1.0", default-features = false, features = ["std"] }
vstd = "=0.0.0-2026-04-20-1748"
tracing = { version = "0.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "=0.4.0"
sha2 = "0.11"

# Collection replays the complete retained judge DAG. Optimize its repeated
# JSON canonicalization in the registered development build as well.
[profile.dev]
opt-level = 1

[profile.dev.package.sha2]
opt-level = 3
