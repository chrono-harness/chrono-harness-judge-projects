[package]
name = "chrono-judge-projects"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-judge-projects"
path = "src/main.rs"
test = false
bench = false

[dependencies]
vstd = "=0.0.0-2026-04-20-1748"
tracing = { version = "0.1", default-features = false, features = ["std"] }
chrono-harness = { git = "https://github.com/chrono-harness/chrono-harness-runner.git", rev = "a1cff08f74d996d618372f20adc203d1b5904d50" }
chrono-judge-registration = { git = "https://github.com/chrono-harness/chrono-harness-judge-registration.git", rev = "76530cce04ad04ebda2f71a16a8a51f930c2daa8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Collection replays the complete retained judge DAG. Optimize its repeated
# JSON canonicalization in the registered development build as well.
[profile.dev]
opt-level = 1

[profile.dev.package.sha2]
opt-level = 3
