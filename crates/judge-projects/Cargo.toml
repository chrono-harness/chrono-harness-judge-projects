[package]
name = "chrono-judge-projects"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-judge-projects"
path = "src/main.rs"
test = false
bench = false

[dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tracing-tunnel = { version = "0.1.0", default-features = false, features = ["std"] }
vstd = "=0.0.0-2026-04-20-1748"
tracing = { version = "0.1", default-features = false, features = ["std"] }
chrono-harness = { git = "https://github.com/chrono-harness/chrono-harness-runner.git", rev = "a1cff08f74d996d618372f20adc203d1b5904d50" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "=0.2.0"
sha2 = "0.10"

# Collection replays the complete retained judge DAG. Optimize its repeated
# JSON canonicalization in the registered development build as well.
[profile.dev]
opt-level = 1

[profile.dev.package.sha2]
opt-level = 3
